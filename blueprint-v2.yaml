blueprint:
  name: Paralelo Virtual (Sem Helper – Final)
  description: Paralelo virtual sem loop usando context.parent_id, sincroniza todos exceto trigger
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  # 🚫 Ignora eventos gerados pela própria automação
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id is none }}

action:
  - variables:
      destinos: !input entrada_switchs

  # 🔁 Sincronização idempotente, exceto o trigger
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: >
                {{ expand(destinos)
                   | rejectattr('entity_id', 'equalto', trigger.entity_id)
                   | selectattr('state', '!=', 'on')
                   | map(attribute='entity_id')
                   | list }}
            continue_on_error: true

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: >
                {{ expand(destinos)
                   | rejectattr('entity_id', 'equalto', trigger.entity_id)
                   | selectattr('state', '!=', 'off')
                   | map(attribute='entity_id')
                   | list }}
            continue_on_error: true

mode: queued
