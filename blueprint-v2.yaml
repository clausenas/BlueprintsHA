blueprint:
  name: Paralelo Virtual (Sem Helper – Final 100%)
  description: Paralelo virtual sem loop, sem helper, sincronização confiável mesmo com clique rápido
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  # 🚫 Ignora eventos gerados pela própria automação
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id is none }}

action:
  - variables:
      destinos: !input entrada_switchs
      # Determina o estado final: se o trigger está ON → todos ON; se trigger OFF → todos OFF
      novo_estado: "{{ trigger.to_state.state }}"

  # 🔁 Sincronização idempotente: aplica novo_estado a todos que estão diferentes
  - service: homeassistant.turn_on
    if: "{{ novo_estado == 'on' }}"
    target:
      entity_id: >
        {{ expand(destinos)
           | selectattr('state', '!=', 'on')
           | map(attribute='entity_id')
           | list }}
    continue_on_error: true

  - service: homeassistant.turn_off
    if: "{{ novo_estado == 'off' }}"
    target:
      entity_id: >
        {{ expand(destinos)
           | selectattr('state', '!=', 'off')
           | map(attribute='entity_id')
           | list }}
    continue_on_error: true

mode: queued
