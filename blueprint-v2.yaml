blueprint:
  name: Paralelo Virtual (Sem Helper – Final 100%)
  description: Paralelo virtual sem loop, sem helper, sincronização instantânea mesmo com clique rápido
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  # Ignora eventos gerados pela própria automação (evita loop)
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id is none }}

action:
  - variables:
      destinos: !input entrada_switchs
      novo_estado: "{{ trigger.to_state.state }}"
      outros: >
        {% set l = [] %}
        {% for e in destinos %}
          {% if e != trigger.entity_id %}
            {% set l = l + [e] %}
          {% endif %}
        {% endfor %}
        {{ l }}

  # 🔁 Aplica o novo estado a todos os dispositivos exceto o trigger
  - repeat:
      for_each: "{{ outros }}"
      sequence:
        - service: >
            {% if novo_estado == 'on' %}
              homeassistant.turn_on
            {% else %}
              homeassistant.turn_off
            {% endif %}
          target:
            entity_id: "{{ repeat.item }}"

mode: queued
