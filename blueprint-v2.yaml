blueprint:
  name: Paralelo Virtual (Sem Helper – Final Confiável)
  description: Paralelo virtual sem loop, sem helper, sincronização instantânea mesmo com clique rápido
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  # Ignora eventos gerados pela própria automação
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id is none }}

action:
  - variables:
      destinos: !input entrada_switchs
      novo_estado: "{{ trigger.to_state.state }}"

  # 🔁 Sincronização sem depender do estado atual, exceto o trigger
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ novo_estado == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: >
                {{ expand(destinos)
                   | rejectattr('entity_id','equalto',trigger.entity_id)
                   | map(attribute='entity_id')
                   | list }}

      - conditions:
          - condition: template
            value_template: "{{ novo_estado == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: >
                {{ expand(destinos)
                   | rejectattr('entity_id','equalto',trigger.entity_id)
                   | map(attribute='entity_id')
                   | list }}

mode: queued
