blueprint:
  name: Paralelo Virtual (Com Lock)
  description: Paralelo virtual sem loop, com lock dinâmico
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

    lock_helper:
      name: Lock de proteção (input_boolean)
      selector:
        entity:
          domain:
            - input_boolean

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  - condition: state
    entity_id: !input lock_helper
    state: "off"

action:
  # 🔒 Lock
  - service: input_boolean.turn_on
    target:
      entity_id: !input lock_helper

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ states(trigger.entity_id) == 'on' }}
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input entrada_switchs

      - conditions:
          - condition: template
            value_template: >
              {{ states(trigger.entity_id) == 'off' }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input entrada_switchs

  # 🔓 Unlock
  - delay:
      milliseconds: 300

  - service: input_boolean.turn_off
    target:
      entity_id: !input lock_helper

mode: queued
