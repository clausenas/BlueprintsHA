blueprint:
  name: Paralelo Virtual (HA novo – estável)
  description: Paralelo virtual sem helper e sem loop (método nativo)
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

trigger:
  - platform: state
    entity_id: !input entrada_switchs

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state is not none and
         trigger.from_state is not none and
         trigger.to_state.state != trigger.from_state.state }}

action:
  - repeat:
      for_each: !input entrada_switchs
      sequence:
        - condition: template
          value_template: >
            {{ repeat.item != trigger.entity_id }}

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ trigger.to_state.state == 'on' }}"
              sequence:
                - service: homeassistant.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"

            - conditions:
                - condition: template
                  value_template: "{{ trigger.to_state.state == 'off' }}"
              sequence:
                - service: homeassistant.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"

mode: queued
