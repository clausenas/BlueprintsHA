blueprint:
  name: Paralelo Virtual (Lock início / fim – TESTE)
  description: Paralelo virtual com lock simples para teste de estabilidade
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

    lock_helper:
      name: Lock de proteção (input_boolean)
      selector:
        entity:
          domain:
            - input_boolean

trigger:
  - platform: state
    entity_id: !input entrada_switchs

action:
  # 🔒 Lock no início
  - service: input_boolean.turn_on
    target:
      entity_id: !input lock_helper

  # 🔁 Sincronização
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'on' }}
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input entrada_switchs
            continue_on_error: true

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'off' }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input entrada_switchs
            continue_on_error: true

  # 🔓 Unlock no final
  - service: input_boolean.turn_off
    target:
      entity_id: !input lock_helper

mode: queued
