blueprint:
  name: Paralelo Virtual (Lock + Idempotente)
  description: Paralelo virtual sem loop, com lock no início/fim e sincronização inteligente
  domain: automation

  input:
    entrada_switchs:
      name: Interruptores / Luzes
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

    lock_helper:
      name: Lock de proteção (input_boolean)
      selector:
        entity:
          domain:
            - input_boolean

trigger:
  - platform: state
    entity_id: !input entrada_switchs

action:
  # Variável local para uso em templates (IMPORTANTE)
  - variables:
      destinos: !input entrada_switchs

  # 🔒 Lock no início
  - service: input_boolean.turn_on
    target:
      entity_id: !input lock_helper

  # 🔁 Sincronização idempotente (SEM LOOP)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: >
                {{ expand(destinos)
                   | selectattr('state', '!=', 'on')
                   | map(attribute='entity_id')
                   | list }}
            continue_on_error: true

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: >
                {{ expand(destinos)
                   | selectattr('state', '!=', 'off')
                   | map(attribute='entity_id')
                   | list }}
            continue_on_error: true

  # 🔓 Unlock no final (sem tempo fixo)
  - service: input_boolean.turn_off
    target:
      entity_id: !input lock_helper

mode: queued
